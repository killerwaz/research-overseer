<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overseer Eval</title>
<style>
  :root { --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd; --ok: #187a3e; --ok-bg: #e6f4ea; --bad: #b42318; --bad-bg: #fdecea; --accent: #2f5bd3; --chip: #eceae4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9b9a93; --line: #33332f; --ok: #6fd39a; --ok-bg: #18301f; --bad: #ff8a7a; --bad-bg: #3a1e1a; --accent: #7fa2ff; --chip: #2b2b28; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  nav a { color: var(--accent); margin-right: 12px; font-size: 13px; }
  h1 { font-size: 16px; margin: 8px 0 2px; }
  .live { color: var(--muted); font-size: 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 130px; }
  .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; }
  summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .q { flex: 1; font-weight: 600; }
  .a { color: var(--muted); font-size: 12px; font-weight: 400; display: block; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .col h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; }
  .hit { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; margin-bottom: 5px; font-size: 12px; }
  .hit.right { border-color: var(--ok); background: var(--ok-bg); }
  .hit b { font-variant-numeric: tabular-nums; }
  .hit .t { color: var(--muted); }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">Cleaning</a><a href="backfill.html">Backfill</a><a href="eval.html">Eval</a></nav>
  <h1>Passage search eval</h1>
  <div class="live" id="live">waiting for data…</div>
  <div class="stats" id="stats"></div>
  <h2>Questions (answer is in the article, not its summary)</h2><div id="qs"></div>
  <h2>Topics the feed should NOT have</h2><div id="abs"></div>
</main>
<script src="poll.js"></script>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ts = (s) => { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let stamp = "", topN = 3;
const pill = (label, rank) => rank == null ? '<span class="pill bad">' + label + ': miss</span>' :
  '<span class="pill ' + (rank <= topN ? 'ok' : 'bad') + '">' + label + ': #' + rank + '</span>';
const hits = (list, doc, title) => '<div class="col"><h3>' + title + '</h3>' + (list || []).map((h) =>
  '<div class="hit' + (doc && h.doc === doc ? ' right' : '') + '"><b>' + h.sim + '</b> · #' + h.doc + (h.n ? ' passage ' + h.n : '') +
  (h.start_s != null ? ' @ ' + ts(h.start_s) : '') + ' · <span class="t">' + esc(h.title) + '</span><br>' + esc(h.text) + '</div>').join('') + '</div>';
function render(d) {
  topN = d.top || 3;
  const ran = d.status === 'run';
  document.getElementById('live').textContent = (ran ? 'results from ' : 'questions only, not run yet — ') + new Date(d.generated_at).toLocaleString();
  document.getElementById('stats').innerHTML = d.summary ? [['passage search', d.summary.passage_hits + ' / ' + d.summary.total],
    ['summary search', d.summary.item_hits + ' / ' + d.summary.total], ['as the router asks', d.summary.tag_hits + ' / ' + d.summary.total],
    ['absent kept clean', d.summary.absent_clean + ' / ' + d.summary.absent_total]].map(([k, v]) => '<div class="stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>').join('') : '';
  document.getElementById('qs').innerHTML = d.questions.map((x) => '<details><summary><span class="q">' + x.id + '. ' + esc(x.q) +
    '<span class="a">expected: #' + x.doc + ' · ' + esc(x.answer) + (x.video ? ' · video' : '') + '</span></span>' +
    (ran ? pill('passages', x.passage_rank) + pill('summaries', x.item_rank) : '') + '</summary>' +
    (ran ? '<div class="cols">' + hits(x.passages, x.doc, 'Passage search (new)') + hits(x.items, x.doc, 'Summary search (today)') + '</div>' : '') + '</details>').join('');
  document.getElementById('abs').innerHTML = d.absent.map((x) => '<details><summary><span class="q">' + x.id + '. ' + esc(x.q) + '</span>' +
    (ran ? '<span class="pill">best passage ' + (x.passages[0] ? x.passages[0].sim : '—') + '</span>' : '') + '</summary>' +
    (ran ? '<div class="cols">' + hits(x.passages, null, 'Passage search') + hits(x.items, null, 'Summary search') + '</div>' : '') + '</details>').join('');
}
async function poll() {
  try { const r = await fetchIfChanged('eval.json');
    if (r && r.ok) { const d = await r.json(); if (d.generated_at !== stamp) { stamp = d.generated_at; render(d); } } } catch (e) {}
  setTimeout(poll, 3000);
}
poll();
</script>
</body>
</html>
