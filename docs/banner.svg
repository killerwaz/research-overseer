<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" role="img" aria-labelledby="banner-title banner-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="banner-title">Research Overseer</title>
  <desc id="banner-desc">Research Overseer — searches, scrapes and scores a research beat, and answers over Telegram. Ten pipeline stages, two of which call a model; triage runs qwen3.5-9b locally on one 12 GB card; 46 tests run in about 100 ms with no dependencies. Shown alongside: a Telegram exchange in which a request to recap the week returns a list of funding rounds — Atoms, Etched, Baseten, Enigma and Natural — each with its sector and amount.</desc>

  <rect width="1280" height="360" fill="#0B0F14"/>

  <rect x="80" y="62" width="44" height="3" fill="#A78BFA"/>

  <text x="80" y="118" font-size="50" font-weight="500" fill="#F8FAFC" letter-spacing="-0.5">Research Overseer</text>

  <text x="80" y="154" font-size="17" font-weight="400" fill="#CBD5E1">Searches, scrapes and scores a research beat.</text>
  <text x="80" y="178" font-size="17" font-weight="400" fill="#CBD5E1">Answers over Telegram.</text>

  <line x1="80" y1="208" x2="164" y2="208" stroke="#1E293B" stroke-width="1"/>

  <g font-size="12.5" font-weight="400" fill="#78899E" letter-spacing="0.1">
    <circle cx="84" cy="232" r="2.5" fill="#A78BFA"/>
    <text x="100" y="236">Ten pipeline stages. Two of them call a model.</text>
    <circle cx="84" cy="256" r="2.5" fill="#A78BFA"/>
    <text x="100" y="260">qwen3.5-9b running locally on one 12&#160;GB card.</text>
    <circle cx="84" cy="280" r="2.5" fill="#A78BFA"/>
    <text x="100" y="284">46 tests, about 100&#160;ms, no dependencies.</text>
  </g>

  <text x="80" y="336" font-size="11" font-weight="400" fill="#475569" letter-spacing="0.4">killerwaz / 2026</text>

  <rect x="650" y="44" width="550" height="280" rx="14" fill="#0E141C" stroke="#1B2430" stroke-width="1"/>
  <text x="670" y="64" font-size="10.5" font-weight="500" fill="#475569" letter-spacing="0.6">TELEGRAM</text>

  <rect x="1038" y="76" width="142" height="32" rx="11" fill="#3E3168"/>
  <text x="1109" y="96" font-size="12" font-weight="400" fill="#E9E2FF" text-anchor="middle">recap the week</text>

  <rect x="670" y="122" width="440" height="178" rx="13" fill="#161D28"/>
  <text x="690" y="148" font-size="12.5" font-weight="600" fill="#F1F5F9">Week of July 21&#8211;27</text>

  <g font-size="12" font-weight="400">
    <text x="690" y="174" fill="#C3CCD9">Atoms <tspan fill="#7C8BA1">&#183; physical AI</tspan></text>
    <text x="1090" y="174" fill="#A78BFA" font-weight="600" text-anchor="end">$1.7B</text>
    <text x="690" y="196" fill="#C3CCD9">Etched <tspan fill="#7C8BA1">&#183; inference stack</tspan></text>
    <text x="1090" y="196" fill="#A78BFA" font-weight="600" text-anchor="end">$300M</text>
    <text x="690" y="218" fill="#C3CCD9">Baseten <tspan fill="#7C8BA1">&#183; inference orchestration</tspan></text>
    <text x="1090" y="218" fill="#A78BFA" font-weight="600" text-anchor="end">$1.5B</text>
    <text x="690" y="240" fill="#C3CCD9">Enigma <tspan fill="#7C8BA1">&#183; embodied AI robotics</tspan></text>
    <text x="1090" y="240" fill="#A78BFA" font-weight="600" text-anchor="end">$70M</text>
    <text x="690" y="262" fill="#C3CCD9">Natural <tspan fill="#7C8BA1">&#183; payments for agents</tspan></text>
    <text x="1090" y="262" fill="#A78BFA" font-weight="600" text-anchor="end">$30M</text>
  </g>

  <text x="690" y="286" font-size="11" font-weight="400" fill="#64748B">&#8230; and 5 more</text>
  <text x="1090" y="286" font-size="9.5" font-weight="400" fill="#475569" text-anchor="end">3:34 AM</text>
</svg>
