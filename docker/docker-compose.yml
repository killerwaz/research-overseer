# Research Overseer's two containers. n8n and Crawl4AI share the user-defined network
# "overseer" (n8n reaches Crawl4AI as http://crawl4ai:11235). LM Studio runs
# natively on the host and is reached as http://host.docker.internal:1234 —
# it is NOT a container, see README.
#
# The volume and network are external so this file can adopt an existing
# installation without recreating anything. Fresh machine, one-time:
#   docker volume create n8n_data
#   docker network create overseer
# Then, from the repo root:
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Deliberately NOT set: WEBHOOK_URL / N8N_EDITOR_BASE_URL. Inbound Telegram
# uses getUpdates polling (see scripts/build-wf00.js), so n8n needs no public
# URL — and the ZZ helper webhooks must never be internet-reachable, their
# only auth is the path suffix.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Dhaka
      - TZ=Asia/Dhaka
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - overseer

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      # Required since 0.9.x for non-loopback binds; same value goes into the
      # n8n "crawl4ai-bearer" credential.
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    volumes:
      # Overrides the image default, which binds 127.0.0.1 only.
      - ./crawl4ai.config.yml:/app/config.yml
    networks:
      - overseer

volumes:
  n8n_data:
    external: true

networks:
  overseer:
    external: true
